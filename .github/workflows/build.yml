name: Build

on:
  push:
  pull_request:
  schedule:
    # Thursday morning UTC, after the Wednesday game update, so a renamed game value fails here first
    - cron: '0 6 * * 4'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
